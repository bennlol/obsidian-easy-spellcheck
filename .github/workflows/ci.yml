name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun ci
      - name: Check and build
        run: bun run check
      - name: Retain plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: easy-spellcheck-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          retention-days: 7
